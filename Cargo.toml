[workspace]
resolver = "3"
members = ["embassy-qemu-riscv", "qemu-riscv-pac"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["Kurtis Dinelle <kurtis.dinelle@gmail.com>"]
license = "MIT"
repository = "https://github.com/kurtjd/qemu-riscv-rs"

[workspace.dependencies]
qemu-riscv-pac = { version = "0.1.0", path = "qemu-riscv-pac" }
riscv = "0.16.0"
riscv-rt = "0.17.0"
riscv-peripheral = "0.5.0"
critical-section = "1.2.0"
vcell = "0.1.3"

embassy-hal-internal = "0.4.0"
embassy-sync = "0.7.2"
embassy-time-driver = "0.2.1"
embassy-time-queue-utils = "0.3.0"

embedded-hal = { package = "embedded-hal", version = "1.0" }
embedded-hal-async = "1.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-mcu-hal = "0.3.0"

defmt = "1.0.1"
