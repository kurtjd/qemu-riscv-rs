[package]
name = "embassy-qemu-riscv"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
description = "Embassy Hardware Abstraction Layer (HAL) for the QEMU RISC-V platform"
authors.workspace = true
license.workspace = true
keywords = ["embedded", "hal", "risc-v", "qemu", "embassy"]
repository.workspace = true

[features]
default = ["time-driver", "rt"]
defmt = ["dep:defmt", "embedded-mcu-hal/defmt"]
rt = ["dep:riscv-rt", "qemu-riscv-pac/rt"]
v-trap = ["rt", "qemu-riscv-pac/v-trap"]

time-driver = ["dep:embassy-time-driver", "dep:embassy-time-queue-utils", "rt"]

[dependencies]
qemu-riscv-pac = { workspace = true, features = [
    "critical-section",
] }
riscv = { workspace = true, features = ["critical-section-single-hart"] }
riscv-rt = { workspace = true, optional = true }
critical-section.workspace = true
defmt = { workspace = true, optional = true }

embassy-time-driver = { workspace = true, features = [
    "tick-hz-10_000_000",
], optional = true }
embassy-time-queue-utils = { workspace = true, optional = true }
embassy-sync.workspace = true
embassy-hal-internal.workspace = true

embedded-hal.workspace = true
embedded-hal-async.workspace = true
embedded-io.workspace = true
embedded-io-async.workspace = true
embedded-mcu-hal.workspace = true
