[package]
name = "qemu-riscv-pac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Peripheral Access Crate (PAC) for the QEMU RISC-V virt platform"
authors.workspace = true
license.workspace = true
keywords = ["embedded", "risc-v", "qemu", "pac", "no-std"]
repository.workspace = true

[package.metadata.cargo-machete]
ignored = ["riscv-peripheral"] # Used by the generated CLINT and PLIC macros.

[dependencies]
critical-section = { workspace = true, optional = true }
riscv.workspace = true
riscv-peripheral.workspace = true
riscv-rt = { workspace = true, features = [
    "device",
    "memory",
], optional = true }
vcell.workspace = true

[features]
rt = ["riscv-rt"]
v-trap = ["rt", "riscv-rt/v-trap"]
