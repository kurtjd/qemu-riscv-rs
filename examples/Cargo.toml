[package]
name = "examples"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-qemu-riscv = { path = "../embassy-qemu-riscv", features = ["defmt"] }
embassy-executor = { version = "0.9.1", features = [
    "arch-riscv32",
    "executor-thread",
] }
embassy-futures = "0.1.2"
embassy-time = "0.4.0"
embedded-mcu-hal = { git = "https://github.com/OpenDevicePartnership/embedded-mcu" }
riscv-rt = "0.17.0"
defmt = "0.3.6"
defmt-semihosting = "0.3.0"
semihosting = { version = "0.1", features = ["panic-handler"] }

# Keyboard demo: HID-over-I2C keyboard service driven by UART input.
embedded-services = { git = "https://github.com/OpenDevicePartnership/embedded-services", features = [
    "defmt",
] }
hid-service = { git = "https://github.com/OpenDevicePartnership/embedded-services", features = [
    "defmt",
] }
keyboard-service = { git = "https://github.com/OpenDevicePartnership/embedded-services", features = [
    "defmt",
] }
static_cell = "2.1"
embassy-sync = "0.8"
